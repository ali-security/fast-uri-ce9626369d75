name: package-manager-ci

on:
  # Deviation from upstream: the `push` / `pull_request` triggers are removed so
  # the fork's sync push cannot fire this reusable-workflow call (it would run
  # yarn/pnpm/npm installs the seal build does not need). The build never
  # dispatches it; `workflow_dispatch` is here only because a workflow needs at
  # least one trigger to be valid.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    permissions:
      contents: read
    uses: fastify/workflows/.github/workflows/plugins-ci-package-manager.yml@v6
