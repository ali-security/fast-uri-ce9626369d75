name: Lock Threads

on:
  # Deviation from upstream: the `schedule` trigger is removed so this
  # issue/PR-locking workflow cannot fire by itself on the build fork. The build
  # never dispatches it. `workflow_dispatch` is kept exactly as upstream had it.
  workflow_dispatch:

concurrency:
  group: lock

permissions:
  contents: read

jobs:
  lock-threads:
    permissions:
      issues: write
      pull-requests: write
    uses: fastify/workflows/.github/workflows/lock-threads.yml@v6
